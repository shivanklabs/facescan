# Local development stack. Secrets come from .env (copy .env.example).
name: facescan

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    FACESCAN_CONFIG_ADAPTERS_PATH: /srv/config/adapters.yaml
    FACESCAN_CONFIG_POLICIES_DIR: /srv/config/policies
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - ./ai/models:/srv/ai/models:ro

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${FACESCAN_DB_USER:-facescan}
      POSTGRES_PASSWORD: ${FACESCAN_DB_PASSWORD:?set FACESCAN_DB_PASSWORD in .env}
      POSTGRES_DB: ${FACESCAN_DB_NAME:-facescan}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # TODO: pin an exact RELEASE tag after checking the current MinIO image distribution.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FACESCAN_STORAGE_ACCESS_KEY:?set FACESCAN_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${FACESCAN_STORAGE_SECRET_KEY:?set FACESCAN_STORAGE_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest  # TODO: pin exact tag
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "/scripts/create_buckets.sh"]
    volumes:
      - ./infra/minio/create_buckets.sh:/scripts/create_buckets.sh:ro
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import app.worker"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    environment:
      VITE_FACESCAN_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
