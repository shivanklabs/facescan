[project]
name = "facescan-ai"
version = "0.0.0"
description = "FaceScan face library (ONNX Runtime, CPU)"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime==1.31.1",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facescan_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
