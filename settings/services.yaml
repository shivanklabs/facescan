# Which adapter implements each port. Resolution order: plan > region > defaults.
# Paid adapters (aws_rekognition, aws_s3, aws_kms, sms_otp) can be added later by config only.
# object_storage: local_filesystem now; s3_compatible is a placeholder for production (Phase 3).
defaults:
  face_detector: yunet
  face_embedder: auraface
  face_embedder_second_opinion: sface
  face_quality: ofiq
  liveness: silent_face
  vector_search: in_memory
  object_storage: local_filesystem
  login: [passkey, staff_key]  # no emails: guests use passkeys, staff use one-time keys
  key_manager: env_master_key
  job_queue: postgres

regions:
  in: {}  # India: defaults; data stays in-region

plans:
  free: {}
