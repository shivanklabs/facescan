# Face-search notice and consent text shown to guests before a face search.
# DRAFT TEXT PENDING LEGAL REVIEW (India, DPDP Act 2023). Do not use with real guests until a
# lawyer has approved both languages. Changing any text requires a new version: guests then
# have to consent again.
version: "2026-11-draft-3"
draft: true
languages:
  en:
    title: "Before you search"
    draft_banner: "Draft text, pending legal review."
    notice: |-
      FaceScan helps people find their own photos from events.
      If you agree, we will compare a live scan of your face with the photos of the events on
      FaceScan, one event at a time, to find the photos you are in.
      Your selfie is processed in memory and never stored. We keep only the list of photos
      that matched you, so you can see them again. Organisers and photographers cannot see
      who matched which photo.
      If you use scene search, your typed search description may be processed by Google to improve search terms; please do not include personal names or private details.
      Photos shown to you come only from the release rules; if a photo is not you, press
      "This is not me" and it is hidden for good.
    consent_label: "I agree that FaceScan may use my live selfie to search this event's photos for me."
    age_question: "Are you 18 or older?"
    minor_message: "Self-service search is not available for people under 18 yet. Please ask the organiser for your photos."
  hi:
    title: "खोज से पहले"
    draft_banner: "मसौदा पाठ, कानूनी समीक्षा बाकी है।"
    notice: |-
      FaceScan लोगों को इवेंट्स से उनकी अपनी तस्वीरें ढूँढने में मदद करता है।
      अगर आप सहमत हैं, तो हम आपके चेहरे के लाइव स्कैन की तुलना FaceScan पर मौजूद इवेंट्स की तस्वीरों से,
      एक-एक इवेंट करके, करेंगे ताकि वे तस्वीरें मिल सकें जिनमें आप हैं।
      आपकी सेल्फ़ी केवल मेमोरी में प्रोसेस होती है और कभी सहेजी नहीं जाती। हम केवल उन तस्वीरों की सूची रखते हैं
      जो आपसे मेल खाती हैं, ताकि आप उन्हें फिर से देख सकें। आयोजक और फ़ोटोग्राफ़र यह नहीं देख सकते कि
      कौन-सी तस्वीर किससे मेल खाई।
      यदि आप दृश्य खोज (scene search) का उपयोग करते हैं, तो खोज शब्दों को बेहतर बनाने के लिए आपके द्वारा लिखे गए विवरण को Google द्वारा प्रोसेस किया जा सकता है; कृपया इसमें व्यक्तिगत नाम या निजी विवरण शामिल न करें।
      अगर कोई तस्वीर आपकी नहीं है, तो "यह मैं नहीं हूँ" दबाएँ, वह हमेशा के लिए छिप जाएगी।
    consent_label: "मैं सहमत हूँ कि FaceScan मेरी लाइव सेल्फ़ी का उपयोग करके इस कार्यक्रम की तस्वीरों में मुझे खोज सकता है।"
    age_question: "क्या आपकी उम्र 18 वर्ष या उससे अधिक है?"
    minor_message: "18 वर्ष से कम उम्र के लोगों के लिए अभी स्वयं खोज उपलब्ध नहीं है। कृपया अपनी तस्वीरों के लिए आयोजक से संपर्क करें।"
