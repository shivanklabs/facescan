[project]
name = "facescan-backend"
version = "0.0.0"
description = "FaceScan API and worker"
requires-python = ">=3.12"
dependencies = [
    "facescan-ai",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.8",
    "alembic==1.20.1",
    "boto3==1.43.126",
    "pyyaml==6.0.3",
    "webauthn==3.0.1",
    "python-multipart==0.0.32",
    "cryptography==50.0.2",
    "httpx2==2.16.0",
    "tokenizers==0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
