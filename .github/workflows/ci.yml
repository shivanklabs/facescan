name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the database, RLS and security tests. Only reachable from this
      # job; trust auth so no password is stored anywhere. The app itself connects as the
      # non-superuser facescan role created by `tasks db-init`.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FACESCAN_ENV: test
      FACESCAN_DB_HOST: localhost
      FACESCAN_DB_PORT: "5432"
      FACESCAN_DB_ADMIN_USER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Generate a random facescan role password for this run
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "FACESCAN_DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "FACESCAN_DB_URL=postgresql+psycopg://facescan:$pw@localhost:5432/facescan" >> "$GITHUB_ENV"
      - name: Create .env with random local secrets
        run: uv run python -c "from scripts.tasks import create_env_file; create_env_file()"
      - run: uv run tasks db-init
      - run: uv run tasks db-migrate
      - run: uv run tasks lint --only python
      - run: uv run tasks licences
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ai/models/*.onnx
            ai/models/tokenizer.json
          key: models-${{ hashFiles('ai/models/models.lock.json') }}
      - name: Download model weights
        run: uv run tasks models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv run tasks test --only python

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
