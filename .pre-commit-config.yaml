# Run by `uv run tasks lint` (pre-commit run --all-files). Local hooks use the tool versions
# pinned in pyproject.toml. gitleaks is pinned to an exact release; pre-commit builds it on first
# use, so nothing needs installing on Windows, Linux or CI.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Staged changes (what the next commit will contain).
      - id: gitleaks
      # Unstaged changes to tracked files.
      - id: gitleaks
        alias: gitleaks-unstaged
        name: Detect hardcoded secrets (unstaged changes)
        entry: gitleaks git --pre-commit --redact --verbose
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: check-licences
        name: check licences
        entry: uv run python scripts/check_licences.py
        language: system
        pass_filenames: false
      - id: no-env-file
        name: refuse committing .env
        entry: .env files must not be committed
        language: fail
        files: '(^|/)\.env$'
